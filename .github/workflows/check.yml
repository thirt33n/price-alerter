name: Check Amazon Prices

on:
  schedule:
    - cron: '0 * * * *'   # every 30 minutes
  workflow_dispatch: {}        # allows manual trigger from Actions tab
  push:
    paths:
      - 'tracked.json'          # run immediately when frontend commits a new item

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tracker
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python tracker.py

      - name: Commit updated tracked.json
        run: |
          git config --global user.name "price-tracker-bot"
          git config --global user.email "actions@github.com"
          git add tracked.json
          git diff --staged --quiet || git commit -m "Update tracked prices [skip ci]"
          git push